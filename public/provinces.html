<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provincias</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="app-body">

    <!-- Header -->
    <header class="app-header">
        <div class="header-content">
            <h1 class="header-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="header-icon">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/>
                </svg>
                Provincias
            </h1>
            <button class="btn btn-outline" id="logoutBtn" onclick="logout()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                    <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                </svg>
                Cerrar sesión
            </button>
        </div>
    </header>

    <!-- Main content -->
    <main class="app-main">

        <!-- Notifications -->
        <div id="notification" class="notification hidden" role="alert"></div>

        <!-- Toolbar -->
        <div class="toolbar">
            <h2 class="section-title">Listado de Provincias</h2>
            <button class="btn btn-primary" onclick="openModal()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
                Nueva Provincia
            </button>
        </div>

        <!-- Table card -->
        <div class="card">
            <div class="table-container">
                <table class="data-table" id="provincesTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Nombre completo</th>
                            <th>Latitud</th>
                            <th>Longitud</th>
                            <th>Orden</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="provincesBody">
                        <tr id="loadingRow">
                            <td colspan="7" class="table-placeholder">Cargando provincias…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Modal para crear / editar -->
    <div class="modal-overlay hidden" id="modalOverlay" onclick="handleOverlayClick(event)">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h3 id="modalTitle">Nueva Provincia</h3>
                <button class="modal-close" onclick="closeModal()" aria-label="Cerrar">&times;</button>
            </div>

            <form id="provinceForm" class="modal-body" novalidate>
                <!-- ID oculto para edición -->
                <input type="hidden" id="provinceId" />

                <div class="form-row">
                    <div class="form-group">
                        <label for="fieldName">Nombre</label>
                        <input type="text" id="fieldName" placeholder="Ej: Buenos Aires" required />
                    </div>
                    <div class="form-group">
                        <label for="fieldDisplayOrder">Orden de visualización</label>
                        <input type="number" id="fieldDisplayOrder" placeholder="Ej: 10" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="fieldFullName">Nombre completo</label>
                    <input type="text" id="fieldFullName" placeholder="Ej: Provincia de Buenos Aires" required />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fieldLatitude">Latitud</label>
                        <input type="number" id="fieldLatitude" step="any" placeholder="Ej: -36.6769" required />
                    </div>
                    <div class="form-group">
                        <label for="fieldLongitude">Longitud</label>
                        <input type="number" id="fieldLongitude" step="any" placeholder="Ej: -60.5588" required />
                    </div>
                </div>

                <div id="modalError" class="error-msg hidden" role="alert"></div>
            </form>

            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveProvince()" id="saveBtn">
                    <span id="saveBtnText">Guardar</span>
                    <span id="saveBtnSpinner" class="spinner hidden"></span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/provinces.js"></script>
</body>
</html>
